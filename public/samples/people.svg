<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(56, 189, 248, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background / Sky & Cityscape -->
  <rect width="800" height="500" fill="url(#skyGrad)" />
  <rect width="800" height="500" fill="url(#grid)" />

  <!-- Distant Buildings -->
  <rect x="40" y="100" width="90" height="250" fill="#131c2e" />
  <rect x="150" y="60" width="110" height="290" fill="#1a243b" />
  <rect x="280" y="120" width="80" height="230" fill="#151e33" />
  <rect x="380" y="80" width="120" height="270" fill="#1c2842" />
  <rect x="520" y="140" width="100" height="210" fill="#141d30" />
  <rect x="640" y="90" width="120" height="260" fill="#192338" />

  <!-- Distant windows glowing -->
  <circle cx="180" cy="100" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="200" cy="120" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="420" cy="110" r="2" fill="#f59e0b" opacity="0.6"/>
  <circle cx="440" cy="130" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="680" cy="120" r="2" fill="#10b981" opacity="0.6"/>

  <!-- Street / Sidewalk -->
  <rect x="0" y="350" width="800" height="150" fill="url(#roadGrad)" />
  <line x1="0" y1="350" x2="800" y2="350" stroke="#334155" stroke-width="2"/>
  
  <!-- Crosswalk / Sidewalk details -->
  <path d="M 0 350 L 800 350 L 800 380 L 0 380 Z" fill="#1e293b" opacity="0.7"/>
  <rect x="80" y="355" width="40" height="20" fill="#475569" opacity="0.5"/>
  <rect x="160" y="355" width="40" height="20" fill="#475569" opacity="0.5"/>
  <rect x="240" y="355" width="40" height="20" fill="#475569" opacity="0.5"/>
  <rect x="320" y="355" width="40" height="20" fill="#475569" opacity="0.5"/>
  <rect x="400" y="355" width="40" height="20" fill="#475569" opacity="0.5"/>
  <rect x="480" y="355" width="40" height="20" fill="#475569" opacity="0.5"/>
  <rect x="560" y="355" width="40" height="20" fill="#475569" opacity="0.5"/>

  <!-- Pedestrian 1 (Left, standing) [x: 140, y: 220, w: 90, h: 220] -->
  <g id="pedestrian1" transform="translate(150, 220)">
    <!-- Shadow -->
    <ellipse cx="25" cy="210" rx="30" ry="8" fill="#000000" opacity="0.5"/>
    <!-- Head -->
    <circle cx="25" cy="25" r="16" fill="#f87171" opacity="0.9"/>
    <!-- Torso -->
    <rect x="12" y="45" width="26" height="75" rx="6" fill="#38bdf8"/>
    <!-- Backpack -->
    <rect x="4" y="55" width="10" height="40" rx="3" fill="#64748b"/>
    <!-- Legs -->
    <rect x="14" y="120" width="10" height="85" rx="3" fill="#1e293b"/>
    <rect x="26" y="120" width="10" height="85" rx="3" fill="#0f172a"/>
  </g>

  <!-- Pedestrian 2 (Center-Right, walking with handbag) [x: 390, y: 200, w: 95, h: 240] -->
  <g id="pedestrian2" transform="translate(400, 195)">
    <!-- Shadow -->
    <ellipse cx="30" cy="235" rx="35" ry="9" fill="#000000" opacity="0.5"/>
    <!-- Head -->
    <circle cx="30" cy="25" r="17" fill="#fbbf24" opacity="0.9"/>
    <!-- Torso / Jacket -->
    <rect x="15" y="46" width="30" height="85" rx="6" fill="#10b981"/>
    <!-- Bag -->
    <rect x="45" y="80" width="14" height="24" rx="3" fill="#f43f5e"/>
    <!-- Legs -->
    <rect x="18" y="131" width="11" height="95" rx="3" fill="#334155" transform="rotate(-6 18 131)"/>
    <rect x="31" y="131" width="11" height="95" rx="3" fill="#1e293b" transform="rotate(8 31 131)"/>
  </g>

  <!-- Bicycle / Rider 3 (Right) [x: 580, y: 260, w: 140, h: 180] -->
  <g id="bicycle_rider" transform="translate(590, 260)">
    <!-- Shadow -->
    <ellipse cx="60" cy="175" rx="55" ry="9" fill="#000000" opacity="0.5"/>
    <!-- Wheels -->
    <circle cx="25" cy="140" r="28" fill="none" stroke="#64748b" stroke-width="4"/>
    <circle cx="105" cy="140" r="28" fill="none" stroke="#64748b" stroke-width="4"/>
    <!-- Frame -->
    <line x1="25" y1="140" x2="65" y2="140" stroke="#0ea5e9" stroke-width="5"/>
    <line x1="65" y1="140" x2="95" y2="90" stroke="#0ea5e9" stroke-width="5"/>
    <line x1="25" y1="140" x2="55" y2="85" stroke="#0ea5e9" stroke-width="5"/>
    <line x1="55" y1="85" x2="95" y2="90" stroke="#0ea5e9" stroke-width="5"/>
    <!-- Rider -->
    <circle cx="65" cy="30" r="14" fill="#fb923c"/>
    <rect x="55" y="48" width="22" height="50" rx="4" fill="#a855f7" transform="rotate(15 55 48)"/>
  </g>

  <!-- Camera HUD overlay elements -->
  <text x="30" y="40" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold">FEED: CAM-01 [STREET_CROSSWALK]</text>
  <text x="30" y="60" fill="#94a3b8" font-family="monospace" font-size="11">RES: 1920x1080@60FPS | COLOR: RGB</text>
  <text x="630" y="40" fill="#10b981" font-family="monospace" font-size="12" font-weight="bold">● LIVE STREAM</text>

  <!-- Corner targeting brackets -->
  <path d="M 20 20 L 40 20 M 20 20 L 20 40" stroke="#0284c7" stroke-width="2" fill="none"/>
  <path d="M 780 20 L 760 20 M 780 20 L 780 40" stroke="#0284c7" stroke-width="2" fill="none"/>
  <path d="M 20 480 L 40 480 M 20 480 L 20 460" stroke="#0284c7" stroke-width="2" fill="none"/>
  <path d="M 780 480 L 760 480 M 780 480 L 780 460" stroke="#0284c7" stroke-width="2" fill="none"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="pSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <pattern id="aGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(16, 185, 129, 0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#pSky)" />
  <rect width="800" height="500" fill="url(#aGrid)" />

  <!-- Distant trees & hills -->
  <path d="M 0 300 Q 150 240 320 280 T 650 260 T 800 290 L 800 500 L 0 500 Z" fill="url(#grass)"/>
  <circle cx="120" cy="220" r="60" fill="#047857" opacity="0.6"/>
  <circle cx="170" cy="230" r="50" fill="#065f46" opacity="0.6"/>
  <circle cx="680" cy="210" r="70" fill="#047857" opacity="0.6"/>
  <circle cx="730" cy="225" r="50" fill="#065f46" opacity="0.6"/>

  <!-- Wooden Bench (Center-right background) -->
  <g id="bench" transform="translate(480, 260)">
    <rect x="0" y="20" width="90" height="8" rx="2" fill="#78350f"/>
    <rect x="0" y="5" width="90" height="8" rx="2" fill="#78350f"/>
    <rect x="10" y="28" width="6" height="30" fill="#1e293b"/>
    <rect x="74" y="28" width="6" height="30" fill="#1e293b"/>
  </g>

  <!-- Dog (Golden retriever standing left-center) [x: 180, y: 240, w: 210, h: 180] -->
  <g id="dog" transform="translate(190, 240)">
    <!-- Shadow -->
    <ellipse cx="90" cy="170" rx="85" ry="14" fill="#000000" opacity="0.5"/>
    <!-- Body -->
    <ellipse cx="90" cy="95" rx="55" ry="32" fill="#d97706" />
    <!-- Neck & Head -->
    <path d="M 125 90 L 155 45 L 175 55 L 140 100 Z" fill="#d97706"/>
    <circle cx="165" cy="50" r="18" fill="#f59e0b"/>
    <!-- Muzzle / Snout -->
    <path d="M 172 48 L 192 56 L 176 64 Z" fill="#b45309"/>
    <circle cx="190" cy="56" r="3" fill="#18181b"/>
    <!-- Ears -->
    <path d="M 152 40 Q 146 62 154 68 Q 160 55 156 40 Z" fill="#92400e"/>
    <!-- Legs -->
    <rect x="52" y="110" width="12" height="60" rx="4" fill="#b45309"/>
    <rect x="74" y="110" width="12" height="60" rx="4" fill="#d97706"/>
    <rect x="110" y="110" width="12" height="60" rx="4" fill="#b45309"/>
    <rect x="130" y="110" width="12" height="60" rx="4" fill="#d97706"/>
    <!-- Tail -->
    <path d="M 38 90 Q 20 60 10 75 Q 16 95 38 100" fill="#f59e0b"/>
    <!-- Collar -->
    <path d="M 148 68 L 158 78" stroke="#ef4444" stroke-width="4"/>
  </g>

  <!-- Cat (Sitting near bench right side) [x: 520, y: 290, w: 90, h: 120] -->
  <g id="cat" transform="translate(530, 290)">
    <!-- Shadow -->
    <ellipse cx="35" cy="115" rx="35" ry="9" fill="#000000" opacity="0.5"/>
    <!-- Body -->
    <ellipse cx="35" cy="75" rx="22" ry="32" fill="#94a3b8"/>
    <!-- Head -->
    <circle cx="35" cy="35" r="16" fill="#cbd5e1"/>
    <!-- Ears -->
    <polygon points="23,28 26,12 33,24" fill="#64748b"/>
    <polygon points="37,24 44,12 47,28" fill="#64748b"/>
    <!-- Eyes -->
    <circle cx="29" cy="34" r="2.5" fill="#10b981"/>
    <circle cx="41" cy="34" r="2.5" fill="#10b981"/>
    <!-- Tail -->
    <path d="M 18 90 Q 0 95 4 80 Q 8 68 18 80" stroke="#94a3b8" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Bird (Flying upper right) [x: 620, y: 80, w: 60, h: 40] -->
  <g id="bird" transform="translate(630, 80)">
    <path d="M 0 15 Q 15 0 30 15 Q 45 0 60 15 Q 30 22 0 15 Z" fill="#f1f5f9"/>
  </g>

  <!-- HUD overlay elements -->
  <text x="30" y="40" fill="#34d399" font-family="monospace" font-size="14" font-weight="bold">FEED: CAM-07 [BOTANICAL_PARK_WEST]</text>
  <text x="30" y="60" fill="#94a3b8" font-family="monospace" font-size="11">RES: 1920x1080@60FPS | WILDLIFE_EDGE_AI</text>
  <text x="630" y="40" fill="#10b981" font-family="monospace" font-size="12" font-weight="bold">● LIVE STREAM</text>

  <!-- Corner targeting brackets -->
  <path d="M 20 20 L 40 20 M 20 20 L 20 40" stroke="#059669" stroke-width="2" fill="none"/>
  <path d="M 780 20 L 760 20 M 780 20 L 780 40" stroke="#059669" stroke-width="2" fill="none"/>
  <path d="M 20 480 L 40 480 M 20 480 L 20 460" stroke="#059669" stroke-width="2" fill="none"/>
  <path d="M 780 480 L 760 480 M 780 480 L 780 460" stroke="#059669" stroke-width="2" fill="none"/>
</svg>
